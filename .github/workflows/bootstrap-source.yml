name: Bootstrap source

on: push

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source package
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | base64 --decode > /tmp/criativas-source.zip
          unzip -o /tmp/criativas-source.zip -d .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: expand Criativas v1.0 source"
          git push origin main
