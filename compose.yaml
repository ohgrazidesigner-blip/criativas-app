services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: criativas
      POSTGRES_USER: criativas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - criativas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U criativas -d criativas"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://criativas:${POSTGRES_PASSWORD}@db:5432/criativas
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRIATIVAS_INITIAL_PASSWORD: ${CRIATIVAS_INITIAL_PASSWORD:?Set CRIATIVAS_INITIAL_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
    depends_on:
      db:
        condition: service_healthy
volumes:
  criativas_pg:
